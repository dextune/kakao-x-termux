<svg width="1600" height="360" viewBox="0 0 1600 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KakaoTalk X Termux workflow</title>
  <desc id="desc">Workflow diagram for notification to reply flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#151A22"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B212B"/>
      <stop offset="1" stop-color="#11161E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FEE500"/>
      <stop offset="1" stop-color="#FF9E2C"/>
    </linearGradient>
    <filter id="shadow" x="20" y="18" width="1560" height="320" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FEE500"/>
    </marker>
  </defs>
  <rect width="1600" height="360" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="44" y="44" width="1512" height="272" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  </g>
  <text x="80" y="98" fill="#F7F8FA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Project Workflow</text>
  <text x="80" y="128" fill="#A8B2C1" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="15">알림 수신부터 봇 판단, 답장 전송까지의 전체 흐름</text>
  <g>
    <rect x="80" y="160" width="220" height="118" rx="20" fill="url(#block)" stroke="rgba(255,255,255,0.08)"/>
    <text x="122" y="202" fill="#F7F8FA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">KakaoTalk</text>
    <text x="122" y="230" fill="#C6CEDA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="15">알림 / 메시지 이벤트</text>
    <text x="122" y="254" fill="#8F98A8" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="13">사용자 대화가 시작되는 지점</text>
  </g>
  <line x1="310" y1="219" x2="404" y2="219" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="420" y="160" width="260" height="118" rx="20" fill="url(#block)" stroke="rgba(255,255,255,0.08)"/>
    <text x="462" y="202" fill="#F7F8FA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Bridge App</text>
    <text x="462" y="230" fill="#C6CEDA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="15">알림 수신 / reply token 확보</text>
    <text x="462" y="254" fill="#8F98A8" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="13">카카오톡 답장 채널과 연결</text>
  </g>
  <line x1="690" y1="219" x2="784" y2="219" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="800" y="160" width="250" height="118" rx="20" fill="url(#block)" stroke="rgba(255,255,255,0.08)"/>
    <text x="842" y="202" fill="#F7F8FA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Termux</text>
    <text x="842" y="230" fill="#C6CEDA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="15">FastAPI 백엔드 / bot loader</text>
    <text x="842" y="254" fill="#8F98A8" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="13">로컬 DB, 규칙, 재시도, 복구</text>
  </g>
  <line x1="1060" y1="219" x2="1154" y2="219" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="1170" y="160" width="330" height="118" rx="20" fill="url(#block)" stroke="rgba(255,255,255,0.08)"/>
    <text x="1212" y="202" fill="#F7F8FA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Bots + Rules</text>
    <text x="1212" y="230" fill="#C6CEDA" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="15">명령형 / 상태형 / 관찰형 봇</text>
    <text x="1212" y="254" fill="#8F98A8" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="13">응답 텍스트 또는 queued job 생성</text>
  </g>
  <line x1="1500" y1="219" x2="1540" y2="219" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="80" y="316" fill="#B8C0CC" font-family="Inter, Pretendard, system-ui, -apple-system, sans-serif" font-size="14">
    Android 알림 권한, Termux 배터리 최적화 제외, 로컬 DB 초기화가 같이 맞아야 workflow가 정상 동작한다.
  </text>
</svg>
